<style>
/* ===== Shell: cabecera + barra lateral (los módulos tienen su CSS aislado en CssAvios / CssCombos) ===== */
:root{--navy:#082D58;--gold:#B2B021;--teal:#1A9F7F;--line:#C9D2DE;--soft:#E8EEF5;--sel:#E8EEF5;--ink:#0E1A2B;--muted:#46566C}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "IBM Plex Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:#EEF2F7;color:var(--ink)}
[hidden]{display:none!important}
.top.shell{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;min-height:52px}
.shell .brand{display:flex;flex-direction:column;line-height:1.05}
.shell .brand b{font-weight:800;font-size:16px;letter-spacing:.14em}
.shell .brand small{font-size:10.5px;color:#C9D4E3;letter-spacing:.04em}
.shell .navtog{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:6px}
.shell .navtog:hover{background:rgba(255,255,255,.1)}
.shell .who{margin-left:auto;font-size:12px;color:#C9D4E3;display:flex;gap:14px;align-items:center}
.sync{font-size:11.5px;font-weight:700;color:#C9D4E3}
.sync.ok{color:#7FD8BF}.sync.run{color:var(--gold)}.sync.err{color:#FFB4A9}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.app.navc{grid-template-columns:minmax(0,1fr)}
.app.navc #nav{display:none}
#nav{position:sticky;top:52px;height:calc(100vh - 52px);background:#fff;border-right:1px solid var(--line);padding:12px 10px 20px;display:flex;flex-direction:column;gap:1px;overflow:auto}
#nav .nsec{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.07em;text-transform:uppercase;padding:14px 10px 6px;display:flex;align-items:center;gap:8px}
#nav .nsec:first-child{padding-top:4px}
#nav .nsec::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--gold)}
#nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink)}
#nav button span{font-size:10.5px;font-weight:800;color:var(--muted);min-width:24px}
#nav button:hover{background:var(--soft)}
#nav button[aria-current="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--gold);color:var(--navy)}
#nav button:focus-visible{outline:2px solid var(--gold)}
.mainz{min-width:0}
#avRoot,#ctRoot{min-height:calc(100vh - 52px)}
#ctRoot{background:#F3F5F8}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  #nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  #nav .nsec{display:none}#nav button{white-space:nowrap}
}
@media print{
  .top.shell,#nav{display:none!important}
  .app{display:block}
  body{background:#fff}
  #avRoot,#ctRoot{background:#fff!important;min-height:0}
}
</style>
<?!= include('CssAvios'); ?>
<?!= include('CssPicker'); ?>
</head>
