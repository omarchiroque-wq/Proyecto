<script>
/* ================= ALMACÉN DE AVÍOS (v3.8.0 integrado en v4.0.0) ================= */

/* ================= Estado ================= */
let A = {user:"", baseQty:"PROG", cargaCerrada:false, maestro:{familias:[],unidades:[],avios:[],marcas:[],medidas:[],skus:[]}, tallas:[], plantillas:[], pedidos:[], clientes:[]};
let IX = {};
let P = null;
let view = "ped", sub = "est", selStyle = null;
let STOCK = null, MOVS = null, expand = {}, movQ = "", movT = "", pedQ = "", pedE = "", pedS = "__ACT", maeQ = "", maeF = "";
let listaOff = false;
let tplMode = null, tplAll = false, plaCli = "", salDest = "", salObs = "", soloComprar = false;
let uid = 0;
/* "Entregado a": planta + talleres del maestro de Combos (Maestros › Talleres). Si aún no hay talleres guardados, la lista fija anterior. */
const destinos = () => { const t = (A.talleres||[]).map(x=>x.nom).filter(Boolean); return t.length ? ["Planta Puente Piedra", ...t] : DESTINOS0; };
const DESTINOS0 = ["Planta Puente Piedra","Taller Angel","Taller Elio","Taller Yoli","Taller Yuvica","Taller Pedro Fernández","Moda BB Kukilin (bordado)"];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r2 = n => Math.round(n*100)/100;
const $ = id => document.getElementById(id);

function run(fn, ...args){
  busy(true);
  return new Promise((ok, ko) => google.script.run
    .withSuccessHandler(r => { busy(false); ok(r); })
    .withFailureHandler(e => { busy(false); toast(e && e.message ? e.message : String(e), true); ko(e); })[fn](...args));
}
function busy(on){ let b = $("busy"); if(on && !b){ b = document.createElement("div"); b.id="busy"; b.className="busy"; b.innerHTML="<span>Procesando…</span>"; $("avHost").appendChild(b);} if(!on && b) b.remove(); }
/* Diálogo de confirmación con el estilo de la app (reemplaza el confirm del navegador) */
/* Ingreso rápido de un SKU desde Reserva y compra. Devuelve {cant, doc, obs, reservar} o null */
function dialogoIngreso(item, sug){
  const s = IX.sku[item] || {}, ci = !A.cargaCerrada;
  return new Promise(res=>{
    const d = document.createElement("div"); d.className = "lb dlgw";
    d.innerHTML = `<div class="dlg" role="dialog"><div class="dlgh">Ingreso de ${esc(item)}</div>
      <div class="dlgb"><div class="note" style="margin-bottom:10px">${esc(s.ext || s.d || "")} · ${esc(s.un || "")}</div>
        <div class="form" style="padding:0">
          <label>Tipo<select class="inp" id="qTipo"><option value="ING">Ingreso (con documento)</option>${ci?`<option value="CI">Carga inicial (sin sustento)</option>`:""}</select></label>
          <label>Cantidad<input class="inp n" id="qCant" type="number" min="0" step="any" value="${sug||""}"></label>
          <label>Documento<input class="inp" id="qDoc" placeholder="Auto ING-…" style="width:140px"></label>
          <label style="flex:1;min-width:160px">Observación<input class="inp" id="qObs"></label></div></div>
      <div class="dlgf"><button class="btn" data-dno>Cancelar</button><button class="btn" data-dsi="0">Registrar</button><button class="btn btn-navy" data-dsi="1">Registrar y reservar</button></div></div>`;
    const fin = v => { d.remove(); document.removeEventListener("keydown", tecla, true); res(v); };
    const tecla = e => { if(e.key==="Escape"){ e.stopPropagation(); fin(null); } };
    d.addEventListener("click", e=>{ e.stopPropagation(); const b = e.target.closest("[data-dsi]");
      if(b) fin({tipo:$("qTipo").value, cant:$("qCant").value, doc:$("qDoc").value, obs:$("qObs").value, reservar: b.dataset.dsi==="1"});
      else if(e.target.closest("[data-dno]") || e.target===d) fin(null); });
    document.addEventListener("keydown", tecla, true);
    $("avHost").appendChild(d); setTimeout(()=>{ const i = $("qCant"); if(i){ i.focus(); i.select(); } }, 0);
  });
}
function confirmar(msg, ok){
  return new Promise(res=>{
    const d = document.createElement("div"); d.className = "lb dlgw";
    d.innerHTML = `<div class="dlg" role="alertdialog"><div class="dlgh">nuna cotton · Confirmar</div>
      <div class="dlgb">${esc(msg).replace(/\n/g,"<br>")}</div>
      <div class="dlgf"><button class="btn" data-dno>Cancelar</button><button class="btn btn-navy" data-dsi>${esc(ok||"Aceptar")}</button></div></div>`;
    const fin = v => { d.remove(); document.removeEventListener("keydown", tecla, true); res(v); };
    const tecla = e => { if(e.key==="Escape"){ e.stopPropagation(); fin(false); } if(e.key==="Enter"){ e.preventDefault(); fin(true); } };
    d.addEventListener("click", e=>{ e.stopPropagation(); if(e.target.closest("[data-dsi]")) fin(true); else if(e.target.closest("[data-dno]") || e.target===d) fin(false); });
    document.addEventListener("keydown", tecla, true);
    $("avHost").appendChild(d); setTimeout(()=>{ const b = d.querySelector("[data-dsi]"); if(b) b.focus(); }, 0);
  });
}
function toast(msg, err){ const t = document.createElement("div"); t.className = "toast"+(err?" err":""); t.textContent = msg; $("avHost").appendChild(t); setTimeout(()=>t.remove(), err?7000:3500); }

/* ================= Índices del maestro ================= */
function indexar(){
  const ver = IX.ver || 0;
  const M = A.maestro, by = (arr,k)=>Object.fromEntries(arr.map(x=>[x[k],x]));
  IX = { fam:by(M.familias,"c"), un:by(M.unidades,"c"), av:by(M.avios,"c"), mar:by(M.marcas,"c"), med:by(M.medidas,"c"), tal:by(A.tallas,"c"), sku:by(M.skus,"id"), skusDe:{} };
  M.skus.forEach(s=>(IX.skusDe[s.cod]=IX.skusDe[s.cod]||[]).push(s));
  /* combinación exacta (avío|marca|medida|color|talla) y sin talla (avío|marca|medida|color) → SKU activo */
  IX.combo = {}; IX.comboST = {}; IX.ver = ver + 1;
  M.skus.forEach(s=>{ if(!s.act) return; const k = s.cod+"|"+s.mar+"|"+s.med+"|"+(s.col||"");
    if(!IX.combo[k+"|"+s.tal]) IX.combo[k+"|"+s.tal] = s;
    if(!IX.comboST[k] || s.tal==="T000") IX.comboST[k] = s; });
}
const entera = un => !!(IX.un[un] && IX.un[un].ent);
const fq = (n,un) => entera(un) ? Math.round(n).toLocaleString("es-PE") : r2(n).toFixed(2);
const mermaDe = cod => { const a = IX.av[cod]; const f = a && IX.fam[a.fam]; return f ? (Number(f.merma)||0) : 0; };
const nomMar = c => c && c!=="M000" ? (IX.mar[c]||{n:c}).n : "";
const nomTal = c => c && c!=="T000" ? (IX.tal[c]||{n:c}).n : "";
const nomMed = c => c && c!=="E000" ? (IX.med[c]||{n:c}).n : "";
const colorDe = s => s.col ? s.col + (s.coln ? " " + s.coln : "") : "";
const skuDet = s => [nomMar(s.mar), nomTal(s.tal), nomMed(s.med), colorDe(s)].filter(Boolean).join(" · ") || "—";
const skuLabel = id => { const s = IX.sku[id]; return s ? (s.ext || s.d) : id; };
const cliMarca = () => { const m = A.maestro.marcas.find(x=>x.cli && P && x.cli===P.cli); return m ? m.c : ""; };

/* ================= Modelo de avíos ================= */
/* Cantidad que usa el BOM: UNDS. PROG. (col L). Sin programado = 0, sin caer a UNDS. PROD. */
const qty = (p,prod) => A.baseQty==="PROD" ? prod : (p!=null ? p : 0);
const sinProg = st => st.tl.filter(x=>x[2]==null).map(x=>x[0]);
const total = st => st.tl.reduce((a,x)=>a+qty(x[2],x[1]),0);
const sumProd = st => st.tl.reduce((a,x)=>a+x[1],0);
const sumProg = st => st.tl.some(x=>x[2]!=null) ? st.tl.reduce((a,x)=>a+(x[2]||0),0) : "—";

/* Línea BOM: {id, cod, proc, para, ref (SKU base: ÚNICO y TALLA), cons, items:[{sku, cons, ct}] (COLOR y MEDIDA)}. El control lo define el avío base. */
const FAM_PROC = {BR:"AC", BT:"AC", TF:"ET", BS:"AC", CJ:"AC", ST:"AC", HT:"AC", EJ:"AC", FL:"AC", IM:"AC", BL:"AC", AD:"AC"};
const existeProc = c => (A.procesos||[]).some(p=>p.c===c);
const procDe = cod => { const a = IX.av[cod]; const c = FAM_PROC[a ? a.fam : String(cod).slice(0,2)] || "CS"; return existeProc(c) ? c : ((A.procesos||[])[0]||{c:c}).c; };
const procLabel = c => { const p = (A.procesos||[]).find(x=>x.c===c); return p ? p.c + " · " + p.n : c; };
const CTL = {UNICO:["U","único","b-gray"], TALLA:["T","x talla","b-ok"], COLOR:["C","color","b-navy"], MEDIDA:["M","medida","b-pend"]};
const ctlDe = cod => { const c = (IX.av[cod]||{}).ctl; return CTL[c] ? c : "UNICO"; };
const skusAv = cod => (IX.skusDe[cod]||[]).filter(s=>s.act);
const sameCombo = (a,b) => a.mar===b.mar && a.med===b.med && (a.col||"")===(b.col||"");
const tlq = st => st.tl.filter(x=>qty(x[2],x[1])>0);
function resolverTalla(r, tc){ const ref = IX.sku[r.ref]; if(!ref || !tc) return null; return IX.combo[r.cod+"|"+ref.mar+"|"+ref.med+"|"+(ref.col||"")+"|"+tc] || null; }
function nuevaLinea(id, st){
  const s = IX.sku[id], ctl = ctlDe(s.cod);
  const r = {id:++uid, cod:s.cod, proc:procDe(s.cod), para:"", ref:s.id, cons:1, items:[]};
  if(ctl==="COLOR") r.items = [{sku:s.id, cons:1}];
  if(ctl==="MEDIDA"){ r.cols = [s.col||""]; r.med = {}; r.ct = {}; }
  initLinea(r, st); return r;
}
/* MEDIDA: {ref (SKU base: marca y color base), cols:[colores], med:{T###:E###}, ct:{T###:consumo}}.
   Cada talla usa su medida; todos los colores comparten medidas y consumos. Cantidad = programada × consumo (+ merma). */
function skuMedida(r, col, med){ const ref = IX.sku[r.ref]; if(!ref || !med) return null; return IX.comboST[r.cod+"|"+ref.mar+"|"+med+"|"+(col||"")] || null; }
function medidasDe(r){ const ref = IX.sku[r.ref]; if(!ref) return []; const col0 = (r.cols||[])[0] ?? ref.col ?? "";
  return [...new Map(skusAv(r.cod).filter(s=>s.mar===ref.mar && (s.col||"")===(col0||"")).map(s=>[s.med, s])).values()].sort((a,b)=>nomMed(a.med).localeCompare(nomMed(b.med),"es",{numeric:true})); }
function coloresDe(r){ const ref = IX.sku[r.ref]; if(!ref) return []; return [...new Map(skusAv(r.cod).filter(s=>s.mar===ref.mar).map(s=>[s.col||"", s])).values()]; }
function convertirMedida(r, st){ /* desde el formato v2.4–v3.0 (items con consumo por talla) */
  if(!r.items || !r.items.length || r.med) return;
  const it0 = IX.sku[r.items[0].sku]; r.ref = r.ref || (it0 ? it0.id : ""); r.cols = [it0 ? it0.col||"" : ""]; r.med = {}; r.ct = {};
  st.tl.forEach(x=>{ const tc = x[3]; if(!tc) return; const it = r.items.find(i=>Number((i.ct||{})[tc])>0) || r.items[0]; const s = IX.sku[it.sku];
    r.med[tc] = s ? s.med : ""; r.ct[tc] = Number((it.ct||{})[tc])||0; });
  r.items = [];
}
function llenarCt(o, st){ o.ct = o.ct || {}; st.tl.forEach(x=>{ if(x[3] && o.ct[x[3]]==null) o.ct[x[3]] = Number(o.cons)||0; }); }
function initLinea(r, st){
  if(!r.proc) r.proc = procDe(r.cod); if(r.para==null) r.para = ""; if(r.cons==null) r.cons = 1; r.items = r.items || []; if(r.ref==null) r.ref = "";
  const ctl = ctlDe(r.cod);
  if(ctl==="MEDIDA"){
    convertirMedida(r, st);
    const ref = IX.sku[r.ref]; r.cols = r.cols && r.cols.length ? r.cols : [ref ? ref.col||"" : ""]; r.med = r.med || {}; r.ct = r.ct || {};
    const nuevo = !Object.keys(r.ct).length;
    st.tl.forEach(x=>{ const tc = x[3]; if(!tc) return; if(r.med[tc]==null) r.med[tc] = ref ? ref.med : ""; if(r.ct[tc]==null) r.ct[tc] = nuevo ? 1 : 0; });
  }
  r.items.forEach(it=>{ if(it.cons==null) it.cons = 1; if(it.modo==="T") llenarCt(it, st); });
  if(ctl==="UNICO" && r.modo==="T") llenarCt(r, st);
}
/* Unidades de cálculo: la línea (ÚNICO, X TALLA) o cada ítem (COLOR, MEDIDA).
   modo "U" = consumo único × total programado (obj.qt ajusta el total) · modo "T" = por talla (obj.ct consumos, obj.q ajustes por talla).
   X TALLA siempre es por talla; MEDIDA arranca por talla; ÚNICO y COLOR arrancan en único. */
const modoDef = ctl => ctl==="MEDIDA" ? "T" : "U";
/* consumo de una talla según el modo (U = mismo consumo en todas las tallas, T = uno por talla) */
const consModo = (o, modo, tc) => modo==="T" ? Number((o.ct||{})[tc])||0 : Number(o.cons)||0;
function unidades(r){
  const ctl = ctlDe(r.cod);
  const mk = (o, sku) => { const modo = o.modo || modoDef(ctl); return {obj:o, sku, modo, cons: tc => consModo(o, modo, tc)}; };
  if(ctl==="UNICO") return [mk(r, ()=>IX.sku[r.ref]||null)];
  if(ctl==="TALLA") return [mk(r, tc=>resolverTalla(r,tc))];
  if(ctl==="MEDIDA") return [];
  return r.items.map(it=>mk(it, ()=>IX.sku[it.sku]||null));
}
const totalProg = st => tlq(st).reduce((a,x)=>a+qty(x[2],x[1]),0);
/* Por talla: [{tn, tc, q, s, auto, ov, val}] */
function porTallaU(st, r, u){
  const merma = mermaDe(r.cod);
  return st.tl.map(([tn,prod,prog,tc])=>{
    const q = qty(prog,prod), s = u.sku(tc), c = u.cons(tc), raw = c*q*(1+merma);
    const auto = s && q>0 && c>0 ? (entera(s.un) ? Math.ceil(raw-1e-9) : r2(raw)) : 0;
    return {tn, tc, q, s, auto, val: auto};
  });
}
/* Único: {tot (prendas), s, auto, ov, val} */
function totalU(st, r, u){
  const tot = totalProg(st), s = u.sku(), c = u.cons(), raw = c*tot*(1+mermaDe(r.cod));
  const auto = s && tot>0 && c>0 ? (entera(s.un) ? Math.ceil(raw-1e-9) : r2(raw)) : 0;
  return {tot, s, auto, val: auto};
}
/* Matriz de Medida: por color y talla → {tn, tc, q, med, cons, s, val} */
function matrizMedida(st, r){
  const merma = mermaDe(r.cod);
  return (r.cols||[]).map(col=>({col, celdas: st.tl.map(([tn,prod,prog,tc])=>{
    const q = qty(prog,prod), med = tc ? (r.med||{})[tc] : "", cons = tc ? consModo(r, r.modo || "T", tc) : 0, s = skuMedida(r, col, med), raw = cons*q*(1+merma);
    return {tn, tc, q, med, cons, s, val: s && q>0 && cons>0 ? (entera(s.un) ? Math.ceil(raw-1e-9) : r2(raw)) : 0};
  })}));
}
function calc(st, r){
  const acc = {}, det = {}, sinTalla = {}, missing = [], ctl = ctlDe(r.cod);
  if(ctl==="MEDIDA"){
    if(!IX.sku[r.ref]) missing.push({tn:"SKU", tc:""});
    else matrizMedida(st, r).forEach(f=>f.celdas.forEach(c=>{
      if(c.q<=0 || c.cons<=0) return;
      if(!c.s){ missing.push({tn:c.tn, tc:c.tc, col:f.col, med:c.med}); return; }
      acc[c.s.id] = (acc[c.s.id]||0) + c.val; det[c.s.id] = det[c.s.id] || {}; det[c.s.id][c.tn] = (det[c.s.id][c.tn]||0) + c.val;
    }));
  }
  unidades(r).forEach(u=>{
    if(ctl!=="TALLA" && !u.sku()){ missing.push({tn: ctl==="UNICO"?"SKU":ctl.toLowerCase(), tc:""}); return; }
    if(u.modo==="U" && ctl!=="TALLA"){ const t = totalU(st, r, u); if(t.s && t.val>0){ acc[t.s.id] = (acc[t.s.id]||0) + t.val; sinTalla[t.s.id] = true; } return; }
    porTallaU(st, r, u).forEach(f=>{
      if(f.q<=0) return;
      if(!f.s){ if(ctl==="TALLA" && u.cons(f.tc)>0) missing.push({tn:f.tn, tc:f.tc}); return; }
      if(f.val<=0) return;
      acc[f.s.id] = (acc[f.s.id]||0) + f.val;
      det[f.s.id] = det[f.s.id] || {}; det[f.s.id][f.tn] = (det[f.s.id][f.tn]||0) + f.val;
    });
  });
  const lines = Object.entries(acc).map(([id,req])=>{ const s = IX.sku[id]; return {item:id, base:r.cod, desc:s.ext || s.d, det:skuDet(s), und:s.un, req, porTalla: sinTalla[id] ? null : (det[id]||null)}; });
  return {lines, missing, ctl};
}
const reqLinea = (st,r) => calc(st,r).lines.reduce((a,l)=>a+l.req,0);
const strip = rows => rows.map(r=>{ const n = JSON.parse(JSON.stringify(r)); delete n.id; return n; });
const isDirty = c => JSON.stringify(strip(P.bom[c]||[])) !== (P.saved[c]||"[]");
const saved = c => (P.saved[c]||"[]") !== "[]";
let LPC = null, LPCk = ""; /* caché del requerimiento consolidado: válida mientras no cambie el BOM guardado, la base de cantidad ni el maestro */
function lineasPE(){
  const k = P.pe + "|" + A.baseQty + "|" + (IX.ver||0) + "|" + P.estilos.map(s=>P.saved[s.c]||"").join("§");
  if(LPC && LPCk===k) return LPC;
  LPCk = k;
  const map = new Map();
  P.estilos.forEach(s=>{
    JSON.parse(P.saved[s.c]||"[]").forEach(r=>calc(s,r).lines.forEach(l=>{
      if(!map.has(l.item)) map.set(l.item, {...l, req:0, est:new Set()});
      const m = map.get(l.item); m.req += l.req; m.est.add(s.c);
    }));
  });
  return LPC = [...map.values()].map(l=>({...l, req: entera(l.und) ? Math.ceil(l.req-1e-9) : Math.ceil(l.req*10-1e-9)/10, est:[...l.est].join(", ")}))
    .sort((a,b)=>a.item.localeCompare(b.item,"es",{numeric:true}));
}
function faltantesDe(st, r){
  const ref = IX.sku[r.ref];
  if(ctlDe(r.cod)==="MEDIDA" && ref){ const seen = new Set();
    return calc(st,r).missing.filter(m=>m.med).filter(m=>{ const k = m.col+"|"+m.med; if(seen.has(k)) return false; seen.add(k); return true; })
      .map(m=>({cod:r.cod, mar:ref.mar, med:m.med, col:m.col||"", coln:((IX.skusDe[r.cod]||[]).find(s=>(s.col||"")===(m.col||""))||{}).coln||"", tal:"T000", tn:nomMed(m.med)})); }
  if(ctlDe(r.cod)!=="TALLA" || !ref) return [];
  return calc(st,r).missing.filter(m=>m.tc).map(m=>({cod:r.cod, mar:ref.mar, med:ref.med, col:ref.col||"", coln:ref.coln||"", tal:m.tc, tn:m.tn}));
}
function faltantesPE(){ const out = []; P.estilos.forEach(s=>(P.bom[s.c]||[]).forEach(r=>faltantesDe(s,r).forEach(m=>out.push({...m, estilo:s.c})))); return out; }
const meta = () => ({cliente:P.cli, marca:P.marca, estilos:P.estilos.length, conBom:P.estilos.filter(s=>saved(s.c)).length});
const sendLines = () => lineasPE().map(l=>({item:l.item, base:l.base, und:l.und, req:l.req}));
const stk = item => (P.stock[item] || {ini:0,ing:0,sal:0,act:0,res:0,disp:0,resPE:0,salPE:0});

/* ================= Imágenes ================= */
const DRIVE = "https:" + "/" + "/drive.google.com/";
const esUrl = v => String(v).indexOf("http") === 0;
const imgUrl = (st,w) => !st.img ? "" : esUrl(st.img) ? st.img : DRIVE + "thumbnail?id=" + st.img + "&sz=w" + w;
function foto(st, cls="thumb"){
  if(!st.img) return `<span class="${cls}"><span class="note">Sin imagen</span></span>`;
  return `<button class="${cls}" data-zoom="${st.c}"><img src="${imgUrl(st, cls==="thumb"?200:600)}" alt="${st.c}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'note',textContent:'Ver imagen'}))"></button>`;
}
function zoom(c){
  const s = P.estilos.find(x=>x.c===c); if(!s) return;
  const lb = document.createElement("div"); lb.className="lb"; lb.id="lb";
  const link = esUrl(s.img) ? s.img : DRIVE + "file/d/" + s.img + "/view";
  lb.innerHTML = `<div class="lb-in"><img src="${imgUrl(s,1200)}" alt="${c}" referrerpolicy="no-referrer">
    <div class="lb-cap"><div><strong>${c}</strong> · ${esc(s.d)}<div class="note">${esc(s.obs)}</div></div>
    <div style="display:flex;gap:12px;align-items:center"><a href="${link}" target="_blank" rel="noopener">Abrir original</a><button class="btn btn-sm" data-closelb>Cerrar</button></div></div></div>`;
  lb.addEventListener("click", e=>{ if(e.target===lb) lb.remove(); });
  $("avHost").appendChild(lb);
}
const tallasHtml = s => `<div class="tallas">${s.tl.map(x=>`<div class="tb" title="${esc(x[3]||"sin código")}"><span>${esc(x[0])}</span><span>${x[2]??"—"}</span></div>`).join("")}</div>`;

/* ================= Navegación ================= */
function medirCabeceras(){
  const root = document.documentElement, top = document.querySelector(".top"), ph = document.querySelector(".pedhead"), ed = document.querySelector("#conEd .ed-top");
  root.style.setProperty("--toph", (top ? top.offsetHeight : 0) + "px");
  root.style.setProperty("--pedh", (ph ? ph.offsetHeight : 0) + "px");

const nfmt = (n,un) => entera(un) && Math.abs(n-Math.round(n))<1e-9 ? String(Math.round(n)) : r2(n).toLocaleString("es-PE",{maximumFractionDigits:2});
function tarjeta(st){

    const a = IX.av[r.cod] || {d:r.cod, un:""}, merma = mermaDe(r.cod), c = calc(st, r), [tc, tn] = CTL[c.ctl], un = a.un;

function imprimirConsumos(){
  const lista = P.estilos.filter(s=>prnSty.has(s.c));

  if(!prnProc.size) return toast("Elige al menos un proceso.", true);
  const hoy = new Date().toLocaleDateString("es-PE"), procs = [...prnProc].join(", ");
  let h = "";
  for(let i=0;i<lista.length;i+=2){
    h += `<table class="pg"><thead><tr><td colspan="2"><div class="phd"><span>nuna cotton · BOM de avíos por estilo · ${P.pe} · ${esc(P.marca)}</span><span>Procesos: ${esc(procs)} · ${hoy} · Hoja ${i/2+1}/${Math.ceil(lista.length/2)}</span></div></td></tr></thead>
       <tbody><tr><td class="pgc">${tarjeta(lista[i])}</td><td class="pgc">${lista[i+1] ? tarjeta(lista[i+1]) : ""}</td></tr></tbody></table>`;
  }
  $("printArea").innerHTML = h;
  document.body.classList.add("printing");
  const imgs = [...document.querySelectorAll("#printArea img")];
  const pend = imgs.filter(i=>!i.complete);
  if(pend.length) toast("Preparando imágenes para imprimir…");
  /* espera a que carguen las fotos (máx. 10 s); las que fallan se reemplazan por un aviso */
  Promise.race([
    Promise.all(pend.map(i=>new Promise(ok=>{ i.addEventListener("load", ok, {once:true}); i.addEventListener("error", ok, {once:true}); }))),
    new Promise(ok=>setTimeout(ok, 10000))
  ]).then(()=>{
    imgs.forEach(i=>{ if(!i.complete || !i.naturalWidth){ const sp = document.createElement("span"); sp.className = "noimgp"; sp.textContent = "Imagen no disponible"; i.replaceWith(sp); } });
    setTimeout(()=>window.print(), 150);
  });
}

}

/* Kardex: tipos = los que se muestran en esta vista (el selector permite elegir uno o ver todos los de la vista). */
function renderMov(tipos, titulo){
  if(!MOVS) return `<div class="panel"><div class="empty">Cargando movimientos…</div></div>`;
  const okT = movT && tipos.includes(movT) ? movT : "";
  const hay = m => [m.item, skuLabel(m.item), m.doc, m.pe, m.dest, m.obs, m.usr].join(" ");
  const list = MOVS.filter(m=>(okT ? m.tipo===okT : tipos.includes(m.tipo)) && NPK.match(hay(m), movQ)).slice(0, 400);
  const cls = {INGRESO:"b-ok",SALIDA:"b-navy",RESERVA:"b-pend",LIBERA:"b-gray","CARGA INICIAL":"b-gray"};
  return `<div class="panel" style="margin-top:18px"><div class="ph"><h2>${titulo}</h2><span class="note">${list.length} de los últimos ${MOVS.length} movimientos</span>
    ${tipos.length>1?`<select class="inp" data-movt style="margin-left:auto"><option value="">Todos: ${tipos.join(", ").toLowerCase()}</option>${tipos.map(t=>`<option value="${t}" ${t===okT?"selected":""}>${t}</option>`).join("")}</select>`:`<span style="margin-left:auto"></span>`}
    <input class="inp" data-movq placeholder="SKU, descripción, documento, PE o destino" value="${esc(movQ)}" style="width:280px"></div>
    <div class="scroll"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>SKU</th><th class="num">Cantidad</th><th>PE</th><th>Destino / obs.</th><th>Usuario</th></tr></thead>
    <tbody>${list.length?list.map(m=>`<tr><td class="nw">${m.fecha}</td><td><span class="badge ${cls[m.tipo]||"b-gray"}">${m.tipo}</span></td><td class="code">${NPK.hl(m.doc, movQ)}</td>
      <td>${NPK.hl(m.item, movQ)}<span class="est">${NPK.hl(skuLabel(m.item), movQ)}</span></td><td class="num">${fq(m.cant,m.und)} ${m.und}</td><td class="nw">${NPK.hl(m.pe, movQ)}</td><td>${NPK.hl(m.dest, movQ)}<span class="est">${NPK.hl(m.obs, movQ)}</span></td><td class="note">${esc(m.usr)}</td></tr>`).join("")
      :`<tr><td colspan="8" class="empty">Sin movimientos.</td></tr>`}</tbody></table></div></div>`;
}

/* ================= Excel ================= */
async function exportXlsx(){
  if(typeof ExcelJS==="undefined"){
    try{ await new Promise((ok,ko)=>{ const sc=document.createElement("script"); sc.src="https:" + "/" + "/cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"; sc.onload=ok; sc.onerror=()=>ko(new Error("x")); document.head.appendChild(sc); setTimeout(()=>ko(new Error("t")),20000); }); }
    catch(e){ return toast("No se pudo descargar la librería de Excel (cdnjs bloqueado o sin internet).", true); }
  }
  const rows = filasCompra().filter(x=>!soloComprar || x.comprar>0);
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet("Rqto compra "+P.pe, {views:[{state:"frozen", ySplit:4}]});
  ws.columns = [16,30,30,7,12,12,12,13,12,16,22,24].map(w=>({width:w}));
  ws.mergeCells("A1:L1"); ws.getCell("A1").value = "Requerimiento de compra de avíos · " + P.pe + " · " + P.marca; ws.getCell("A1").font = {bold:true,size:14,color:{argb:"FF082D58"}};
  ws.mergeCells("A2:L2"); ws.getCell("A2").value = "Emitido " + new Date().toLocaleString("es-PE") + " por " + A.user + " · Requerido incluye merma de familia"; ws.getCell("A2").font = {italic:true,size:10,color:{argb:"FF5B6B80"}};
  const h = ws.getRow(4); h.values = ["SKU","Descripción extensa","Detalle","UN","Requerido","Stock actual","Stock reserva","Reservado PE","Atendido PE","Rqto. saldo a comprar","Proveedor","Estilos"];
  h.eachCell(c=>{ c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF082D58"}}; c.alignment={vertical:"middle",wrapText:true}; }); h.height = 30;
  rows.forEach((x,i)=>{ const r = 5+i, row = ws.getRow(r);
    row.values = [x.item,x.desc,x.det,x.und,x.req,x.s.act,x.s.res,x.s.resPE,x.s.salPE,{formula:"MAX(0,E"+r+"-I"+r+"-H"+r+"-MAX(0,F"+r+"-G"+r+"))", result:x.comprar},x.prov,x.est];
    [5,6,7,8,9,10].forEach(c=>row.getCell(c).numFmt = entera(x.und)?"#,##0":"#,##0.00");
    row.getCell(10).font = {bold:true,color:{argb:x.comprar>0?"FFB3261E":"FF1A9F7F"}}; });
  ws.autoFilter = {from:"A4", to:"L"+(4+rows.length)};
  const blob = new Blob([await wb.xlsx.writeBuffer()], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Rqto_compra_avios_" + P.pe + ".xlsx"; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= Eventos ================= */
const curSt = () => P.estilos.find(s=>s.c===selStyle);
const findRow = id => P.bom[selStyle].find(r=>r.id==id);
function mergePed(p){ if(!p) return; const i = A.pedidos.findIndex(x=>x.pe===p.pe); if(i>=0) A.pedidos[i] = p; else A.pedidos.unshift(p); }
function afterAction(r, msg){ P.stock = r.stock; mergePed(r.ped); STOCK = null; MOVS = null; render(); toast(msg); }
function setMaestro(m){ A.maestro = m; indexar(); }

const inAV = el => !!(el && el.closest && el.closest("#avRoot, #avHost"));
document.addEventListener("click", async e=>{
  if(!inAV(e.target)) return;
  const b = e.target.closest("button, tr.mrow, article.pcard"); if(!b) return;
  const d = b.dataset;
  if(b.matches("tr.mrow")){ if(e.target.closest("input,select,label")) return; expand[d.exp] = !expand[d.exp]; return render(); }
  if(d.skupk){ const [rid, modo, i] = d.skupk.split("|"); return pkSku(rid, modo, i); }
  if(d.pkavio) return pkAvio(d.pkavio, d.pkavio==="nCod" ? ()=>refrescarAlta() : cod=>{ const a = IX.av[cod]; $("kCodInfo").textContent = a ? "control " + CTL[a.ctl||"UNICO"][1] + " · " + (IX.skusDe[a.c]||[]).length + " SKU" : ""; });
  if(d.pkskuall) return pkSkuAll(d.pkskuall);
  if(d.zoom!==undefined){ e.stopPropagation(); return zoom(d.zoom); }
  if(d.closelb!==undefined) return $("lb") && $("lb").remove();
  if(d.vercad){ e.stopPropagation(); return verCad(d.vercad, d.pe); }
  if(d.pedmas!==undefined){ pedMax += PED_TANDA; const g = $("pgrid"); if(g) g.innerHTML = gridPedidos(filtrarPedidos()); return; }
  if(d.open) return abrirPedido(d.open);
  if(d.pchip!==undefined){ pedE = d.pchip; pedMax = PED_TANDA; return render(); }
  if(d.pschip!==undefined){ pedS = d.pschip; pedMax = PED_TANDA; return render(); }
  if(d.cerrar!==undefined){ if(Object.keys(P.bom).some(isDirty) && !(await confirmar("Hay consumos sin guardar. ¿Salir igual?"))) return; P = null; render(); if(view==="res" || view==="sal"){ MOVS = await run("getMovimientos", ""); render(); } return; }
  if(d.sub){ sub = d.sub; tplMode = null;
    if(sub==="res" || sub==="sal"){ const [st, mv] = await Promise.all([run("getStock", P.pe), sub==="sal" ? run("getMovimientos", P.pe) : Promise.resolve(MOVS)]); P.stock = st; MOVS = mv; }
    return render(); }
  if(d.edit){ selStyle = d.edit; sub = "con"; return render(); }
  if(d.pick){ selStyle = d.pick; tplMode = null; cerrarModal(); return render(); }
  if(d.lista!==undefined){ listaOff = !listaOff; return render(); }
  const st = P && curSt();
  if(d.addsku){ const s = IX.sku[d.addsku]; P.bom[st.c].push(nuevaLinea(d.addsku, st)); recien.add(d.addsku); render();
    return toast((s ? s.cod : d.addsku) + " agregado al BOM de " + st.c + ". Recuerda Guardar BOM."); }
  if(d.altaavio!==undefined) return abrirAlta();
  if(d.guardaralta!==undefined) return guardarAlta();
  if(d.cerrarmodal!==undefined) return cerrarModal();
  if(d.iadd){ const r = findRow(d.iadd), ctl = ctlDe(r.cod), usados = new Set(r.items.map(x=>x.sku)), lista = porMarca(skusAv(r.cod));
    const sig = (lista.find(x=>!usados.has(x.id)) || lista[0] || {}).id || "";
    r.items.push(ctl==="MEDIDA" ? {sku:sig, ct:{}} : {sku:sig, cons:1}); initLinea(r, st); return render(); }
  if(d.idel){ const r = findRow(d.id); r.items.splice(+d.idel, 1); return render(); }
  if(d.maddcol){ const r = findRow(d.maddcol), usados = new Set(r.cols), sig = coloresDe(r).map(s=>s.col||"").find(c=>!usados.has(c)); if(sig==null) return toast("No hay otro color con SKU para esta marca. Créalo con + Registrar avío nuevo.", true); r.cols.push(sig); return render(); }
  if(d.mdel){ const r = findRow(d.id); r.cols.splice(+d.mdel, 1); return render(); }
  if(d.del){ P.bom[st.c] = P.bom[st.c].filter(r=>r.id!=d.del); return render(); }
  if(d.crearfalt!==undefined){
    const f = []; const seen = new Set();
    P.bom[st.c].forEach(r=>faltantesDe(st,r).forEach(m=>{ const k = [m.cod,m.mar,m.tal,m.med,m.col].join("|"); if(seen.has(k)) return; seen.add(k); f.push(m); }));
    if(!f.length) return toast("Las tallas faltantes no tienen código T### en DETALLE_TALLAS.", true);
    if(!(await confirmar("Crear " + f.length + " SKU nuevos en BD_AVIOS?\n" + f.map(x=>x.cod+" · "+x.mar+" · "+x.tal+" · "+x.med+(x.col?" · "+x.col:"")).join("\n")))) return;
    const r = await run("crearSKUs", f); setMaestro(r.maestro); render(); return toast("SKU creados: " + r.ids.join(", "));
  }
  if(d.savebom!==undefined){
    const rows = strip(P.bom[st.c]), prev = P.saved[st.c];
    P.saved[st.c] = JSON.stringify(rows); LPC = null;
    let r;
    try { r = await run("guardarBOM", P.pe, st.c, st.m, rows, meta(), sendLines()); } catch(err){ P.saved[st.c] = prev; return; }
    mergePed(r.ped); P.stock = r.stock;
    const falt = P.bom[st.c].reduce((a,x)=>a+calc(st,x).missing.length,0);
    render(); return toast("BOM de " + st.c + " guardado." + (falt ? " Ojo: " + falt + " tallas sin SKU." : "") + (r.liberadas ? " Se liberó reserva sobrante." : ""));
  }
  if(d.hist!==undefined){
    const h = await run("bomPorMolde", st.m, st.c);
    if(!h) return toast("No hay BOM guardado con el molde " + st.m + ".", true);
    if(P.bom[st.c].length && !(await confirmar("Reemplazar los avíos de " + st.c + " con los de " + h.modelo + " (" + h.pe + ")?"))) return;
    P.bom[st.c] = h.rows.filter(x=>x && x.cod).map(r=>{ r.id = ++uid; initLinea(r, st); return r; }); render(); return toast("Copiado de " + h.modelo + ". Revisa y guarda.");
  }
  if(d.tpl){ tplMode = d.tpl==="close" ? null : d.tpl; if(tplMode==="print"){ prnProc = null; prnSty = null; } return render(); }
  if(d.doprint!==undefined) return imprimirConsumos();
  if(d.tsave!==undefined){
    const p = {code:$("tCode").value.trim().toUpperCase(), cli:$("tCli").value, desc:$("tDesc").value.trim(), molde:st.m, rows:strip(P.bom[st.c])};
    A.plantillas = await run("guardarPlantilla", p); tplMode = null; render(); return toast("Plantilla " + p.code + " guardada.");
  }
  if(d.tapply){
    const p = A.plantillas.find(x=>x.code===d.tapply);
    if(P.bom[st.c].length && !(await confirmar(st.c + " ya tiene avíos. ¿Reemplazarlos con " + p.code + "?"))) return;
    P.bom[st.c] = JSON.parse(JSON.stringify(p.rows)).filter(x=>x && x.cod).map(r=>{ r.id = ++uid; initLinea(r, st); return r; }); tplMode = null; render(); return toast("Plantilla " + p.code + " aplicada. Revisa y guarda.");
  }
  if(d.tdel){ if(!(await confirmar("¿Eliminar la plantilla " + d.tdel + "?"))) return; A.plantillas = await run("eliminarPlantilla", d.tdel); return render(); }
  if(d.reservar!==undefined){ const r = await run("reservar", P.pe, meta(), sendLines()); return afterAction(r, r.n ? "Reserva " + r.doc + ": " + r.n + " SKU. Estado: " + r.estado + "." : "No hay disponible para reservar. Revisa el saldo a comprar."); }
  if(d.liberar!==undefined){ if(!(await confirmar("¿Liberar toda la reserva pendiente de " + P.pe + "?"))) return; const r = await run("liberar", P.pe, meta(), sendLines()); return afterAction(r, "Reserva liberada (" + r.doc + ")."); }
  if(d.xls!==undefined) return exportXlsx();
  if(d.fill){ document.querySelectorAll("[data-sal]").forEach(i=>i.value = d.fill==="res" ? i.dataset.res : d.fill==="max" ? i.dataset.max : 0); return; }
  if(d.salida!==undefined){
    const ls = lineasPE(), out = [];
    for(const i of document.querySelectorAll("[data-sal]")){ const q = Number(i.value)||0; if(q<=0) continue; if(q > Number(i.dataset.max)+1e-9) return toast(i.dataset.sal + ": máximo " + i.dataset.max + ".", true); const l = ls.find(x=>x.item===i.dataset.sal); out.push({item:l.item, base:l.base, und:l.und, cant:q}); }
    if(!out.length) return toast("Ingresa al menos una cantidad a despachar.", true);
    if(!(await confirmar("Generar salida de " + out.length + " SKU para " + $("sDest").value + "?"))) return;
    const r = await run("generarSalida", P.pe, meta(), sendLines(), out, $("sDest").value, $("sObs").value);
    salObs = ""; P.stock = r.stock; mergePed(r.ped); STOCK = null; MOVS = await run("getMovimientos", P.pe); render(); return toast("Salida " + r.doc + " generada. Estado: " + r.estado + ".");
  }
  if(d.ingreso!==undefined){
    const tipo = $("iTipo").value, item = $("iItem").value.trim().toUpperCase();
    if(!item) return toast("Elige el SKU con el buscador antes de registrar.", true);
    if(!IX.sku[item]) return toast("SKU no encontrado: " + item, true);
    const r = tipo==="CI" ? await run("cargaInicial", {item, cant:$("iCant").value, obs:$("iObs").value}, P ? P.pe : "")
                          : await run("registrarIngreso", {item, cant:$("iCant").value, doc:$("iDoc").value, obs:$("iObs").value}, P ? P.pe : "");
    if(P) P.stock = r.stock;
    STOCK = r.stock; MOVS = await run("getMovimientos", ""); render(); return toast((tipo==="CI"?"Carga inicial":"Ingreso " + r.doc) + ": " + item + ".");
  }
  if(d.cerrarci!==undefined){ if(!(await confirmar("Cerrar la carga inicial? Después solo se podrá registrar ingresos con documento. No se puede deshacer desde la app."))) return; await run("cerrarCargaInicial"); A.cargaCerrada = true; render(); return toast("Carga inicial cerrada."); }
  if(d.nuevosku!==undefined){
    const r = await run("crearSKU", {cod:$("kCod").value, mar:$("kMar").value, tal:$("kTal").value, med:$("kMed").value, col:$("kCol").value, coln:$("kColn").value, ubic:$("kUbic").value, tipo:$("kTipo").value, add:$("kAdd").value});
    setMaestro(r.maestro); expand[IX.sku[r.id].cod] = true; maeQ = ""; render(); return toast("SKU " + r.id + " creado.");
  }
  if(d.nuevoavio!==undefined){ const r = await run("crearAvio", {fam:$("aFam").value, d:$("aDesc").value, un:$("aUn").value, pres:$("aPres").value}); setMaestro(r.maestro); render(); return toast("Avío " + r.cod + " creado."); }
  if(d.nuevamarca!==undefined){ const r = await run("crearMarca", {n:$("mNom").value, cli:$("mCli").value}); setMaestro(r.maestro); render(); return toast("Marca " + r.cod + " creada."); }
  if(d.nuevamedida!==undefined){ const r = await run("crearMedida", {n:$("eNom").value}); setMaestro(r.maestro); render(); return toast("Medida " + r.cod + " creada."); }
  if(d.refped!==undefined){ A.pedidos = await run("getPedidos", true); render(); return toast("Pedidos actualizados desde PLAN DE VENTAS."); }
  if(d.cfgadd){ cfgEdit[d.cfgadd].push({c:"", n:"", o:0, act:true}); return render(); }
  if(d.cfgdel){ const [l,i] = d.cfgdel.split("|"); cfgEdit[l].splice(+i,1); return render(); }
  if(d.cfgmv){ const [l,i,dir] = d.cfgmv.split("|"), a = cfgEdit[l], j = +i + +dir; [a[+i], a[j]] = [a[j], a[+i]]; return render(); }
  if(d.cfgsave){
    const l = d.cfgsave, items = cfgEdit[l].map(x=>({c: l==="PARA" ? x.n : x.c, n:x.n, act:x.act}));
    const r = await run("guardarConfig", l, items);
    A.procesos = r.procesos; A.paras = r.paras; cfgEdit = {PROCESO: JSON.parse(JSON.stringify(r.procesos)), PARA: JSON.parse(JSON.stringify(r.paras))};
    render(); return toast((l==="PROCESO"?"Procesos":"Lista Para") + " guardada.");
  }
  if(d.ingrap){
    const v = await dialogoIngreso(d.ingrap, d.sug); if(!v) return;
    const r = v.tipo==="CI" ? await run("cargaInicial", {item:d.ingrap, cant:v.cant, obs:v.obs}, P.pe)
                            : await run("registrarIngreso", {item:d.ingrap, cant:v.cant, doc:v.doc, obs:v.obs}, P.pe);
    P.stock = r.stock; STOCK = null;
    if(v.reservar){ const rr = await run("reservar", P.pe, meta(), sendLines()); return afterAction(rr, (v.tipo==="CI"?"Carga inicial":"Ingreso " + r.doc) + " registrado y reservado (" + (rr.doc||"sin cambios") + "). Estado: " + rr.estado + "."); }
    render(); return toast((v.tipo==="CI"?"Carga inicial":"Ingreso " + r.doc) + " registrado. Stock actualizado: ya puedes reservar."); }
  if(d.refstock!==undefined){ STOCK = await run("getStock"); return render(); }
});

function toggleSave(){ const st = curSt(), sb = document.querySelector("[data-savebom]"); if(st && sb) sb.disabled = !isDirty(st.c); }
document.addEventListener("change", async e=>{
  if(!inAV(e.target)) return;
  const t = e.target, d = t.dataset;
  if(d.lf){
    const st = curSt(), r = findRow(d.id); if(!r) return;
    if(d.lf==="proc"){ r.proc = t.value; return toggleSave(); }
    if(d.lf==="para"){ r.para = t.value; return toggleSave(); }
    if(d.lf==="ref"){ const v = t.value.trim().toUpperCase(), s = IX.sku[v];
      if(!s || s.cod!==r.cod || !s.act){ toast(v ? v + " no es un SKU activo de " + r.cod + ". Elige uno de la lista." : "Elige un SKU de la lista.", true); return render(); }
      r.ref = v; if(ctlDe(r.cod)==="MEDIDA"){ r.cols = r.cols && r.cols.length ? r.cols : [""]; r.cols[0] = s.col||""; } return render(); }
    if(d.lf==="cons") return render();
    return;
  }
  if(d.li==="cons" || d.li==="ct") return render();
  if(d.modo!==undefined){ const st = curSt(), r = findRow(d.id); if(!r) return; const o = d.modo==="L" ? r : r.items[+d.modo];
    o.modo = t.value; if(o.modo==="T") llenarCt(o, st); else if(o.cons==null){ const v = Object.values(o.ct||{}).find(x=>Number(x)>0); o.cons = v!=null ? Number(v) : 1; } return render(); }
  if(d.mt!==undefined){ const r = findRow(d.id); if(!r) return; r.med[d.mt] = t.value; return render(); }
  if(d.mc!==undefined){ const r = findRow(d.id); if(!r) return; r.ct[d.mc] = +t.value||0; return render(); }
  if(d.mcol!==undefined){ const r = findRow(d.id); if(!r) return; r.cols[+d.mcol] = t.value; return render(); }
  if(d.li==="sku"){ const r = findRow(d.id); if(!r) return; const v = t.value.trim().toUpperCase(), s = IX.sku[v];
    if(!s || s.cod!==r.cod || !s.act){ toast(v ? v + " no es un SKU activo de " + r.cod + ". Elige uno de la lista." : "Elige un SKU de la lista.", true); return render(); }
    r.items[+d.i].sku = v; return render(); }
  if(d.cf && t.type==="checkbox"){ const [l,i] = d.cf.split("|"); cfgEdit[l][+i].act = t.checked; return render(); }
  if(d.nmodo!==undefined || d.nctl!==undefined || d.ncod!==undefined){ refrescarAlta(); return; }
  if(d.kcod!==undefined){ const a = IX.av[t.value.trim().toUpperCase()]; $("kCodInfo").textContent = a ? a.d + " · " + a.un + " · control " + CTL[a.ctl||"UNICO"][1] + " · " + (IX.skusDe[a.c]||[]).length + " SKU" : (t.value ? "No existe ese avío base" : ""); return; }
  if(d.afam!==undefined){ $("aFamInfo").textContent = "Control: " + CTL[(IX.fam[t.value]||{}).ctl||"UNICO"][1]; return; }
  if(d.addsolo!==undefined){ addSolo = t.checked; const box = $("addRes"); if(box) box.innerHTML = resultadosAdd(); return; }
  if(d.tcli!==undefined){ $("tCode").value = nextTpl(t.value); return; }
  if(d.tall!==undefined){ tplAll = t.checked; return render(); }
  if(d.pproc!==undefined){ t.checked ? prnProc.add(d.pproc) : prnProc.delete(d.pproc); return render(); }
  if(d.psty!==undefined){ t.checked ? prnSty.add(d.psty) : prnSty.delete(d.psty); return render(); }
  if(d.pcli!==undefined){ plaCli = t.value; return render(); }
  if(d.solo!==undefined){ soloComprar = t.checked; return render(); }
  if(d.pede!==undefined){ pedE = t.value; return render(); }
  if(d.peds!==undefined){ pedS = t.value; return render(); }
  if(d.pord!==undefined){ pedOrden = t.value; return render(); }
  if(d.movt!==undefined){ movT = t.value; return render(); }
  if(d.maef!==undefined){ maeF = t.value; return render(); }
  if(d.sdest!==undefined){ salDest = t.value; return; }
  if(d.famctl){ setMaestro(await run("actualizarFamilia", d.famctl, {ctl:t.value})); render(); return toast("Familia " + d.famctl + ": control " + CTL[t.value][1] + ". Lo heredan todos sus avíos."); }
  if(d.ubic){ setMaestro(await run("actualizarSKU", d.ubic, {ubic:t.value})); return toast("Ubicación de " + d.ubic + " guardada."); }
  if(d.skuadd){ setMaestro(await run("actualizarSKU", d.skuadd, {add:t.value})); render(); return toast("Descripción de " + d.skuadd + " actualizada."); }
  if(d.skuact){ setMaestro(await run("actualizarSKU", d.skuact, {act:t.checked})); return render(); }
  if(d.marlogo){ setMaestro(await run("actualizarMarcaLogo", d.marlogo, t.value)); render(); return toast("Logo de " + d.marlogo + " guardado."); }
  if(d.marcli){ setMaestro(await run("actualizarMarcaCliente", d.marcli, t.value)); return toast("Marca " + d.marcli + " vinculada."); }
});
document.addEventListener("input", e=>{
  if(!inAV(e.target)) return;
  const t = e.target, d = t.dataset;
  if(d.cf && t.type!=="checkbox"){ const [l,i,k] = d.cf.split("|"); cfgEdit[l][+i][k] = k==="c" ? t.value.trim().toUpperCase() : t.value; return; }
  const keep = (sel, v) => { const p = t.selectionStart; render(); const n = document.querySelector(sel); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  if(d.pedq!==undefined){ pedQ = t.value; pedMax = PED_TANDA; const g = $("pgrid"); if(g){ g.innerHTML = gridPedidos(filtrarPedidos()); return; } return keep("[data-pedq]"); }
  if(d.movq!==undefined){ movQ = t.value; return keep("[data-movq]"); }
  if(d.plaq!==undefined){ plaQ = t.value; return keep("[data-plaq]"); }
  if(d.maeq!==undefined){ maeQ = t.value; return keep("[data-maeq]"); }
  if(d.sobs!==undefined){ salObs = t.value; return; }
  if(d.addq!==undefined){ addQ = t.value; const box = $("addRes"); if(box) box.innerHTML = resultadosAdd(); return; }
  if(d.lf==="cons" || d.li==="cons" || d.li==="ct"){
    const st = curSt(), r = findRow(d.id); if(!r) return;
    if(d.lf==="cons") r.cons = +t.value||0;
    if(d.li==="cons") r.items[+d.i].cons = +t.value||0;
    if(d.li==="ct"){ const o = d.i==="L" ? r : r.items[+d.i]; o.ct = o.ct || {}; o.ct[d.t] = +t.value||0; }
    refrescarLinea(r);
  }
});
document.addEventListener("keydown", e=>{
  if(NPK.abierto || !inAV(e.target) && !(e.key==="Escape" && ($("lb") || enModal))) return;
  if(e.key==="Enter" && e.target && e.target.classList && e.target.classList.contains("pcard")){ abrirPedido(e.target.dataset.open); return; }
  if(e.key==="Escape"){ if(enModal) return cerrarModal(); if($("lb")) $("lb").remove(); }
});

/* ================= Inicio ================= */
function fatal(msg){
  window.__boot.ok = true; $("app").setAttribute("data-fatal","1"); $("avRoot").hidden = false; $("ctRoot").hidden = true;
  $("app").innerHTML = `<div class="panel" style="padding:20px"><h2 style="margin:0 0 8px;font-size:16px;color:var(--danger)">No se pudo cargar la app</h2>
    <p style="margin:0 0 12px">${esc(msg)}</p>
    <div class="note">Revisa: 1) que ejecutaste <b>setup()</b> en el editor; 2) que autorizaste la app; 3) que tu cuenta tiene acceso de lectura a PLAN DE VENTAS 2026;
    4) si tienes varias cuentas Google abiertas, abre la app en incógnito con una sola cuenta.</div></div>`;
}
let ready = false;
window.addEventListener("error", e => ready ? toast("Error: " + e.message, true) : fatal("Error en la página: " + e.message + (e.lineno ? " · línea " + e.lineno + ":" + (e.colno||0) : "") + " · archivos cargados: JsComun " + (typeof NPK!=="undefined" ? "✓" : "✗") + " · JsAvios ✓"));
window.imgFalla = imgFalla;
const initTimer = setTimeout(()=>fatal("El servidor no respondió en 40 segundos."), 40000);
google.script.run
  .withSuccessHandler(raw=>{
    clearTimeout(initTimer);
    try{
      const r = typeof raw==="string" ? JSON.parse(raw) : raw;
      if(!r) throw new Error("El servidor devolvió una respuesta vacía.");
      A = r; if(!A.maestro) A.maestro = {familias:[],unidades:[],avios:[],marcas:[],medidas:[],skus:[]};
      indexar(); $("user").textContent = r.user; if(r.version) $("ver").textContent = r.version; ready = true; window.__boot.ok = true;
      if(!$("app").getAttribute("data-fatal")) Shell.go(Shell.last()); /* si hubo error de carga, se deja visible */
      if(r.errores && r.errores.length) toast("Avisos al cargar: " + r.errores.join(" | "), true);
    }catch(e){ fatal(e.message); }
  })
  .withFailureHandler(e=>{ clearTimeout(initTimer); fatal(e && e.message ? e.message : String(e)); })
  .getInit();
</script>
