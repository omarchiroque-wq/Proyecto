<style>
/* Combos textil — aislado en #ctRoot (y selector .ctx). Generado desde el mockup v33. */

:where(#ctRoot,.ctx){
  --navy:#082D58;--gold:#B2B021;--teal:#1A9F7F;
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#F7F9FC;--ink:#0E1A2B;--muted:#46566C;--line:#C9D2DE;--soft:#E8EEF5;--warn:#8A6D00;--danger:#B3261E;--tealsoft:#E3F4EF;--goldsoft:#F4F3D9;--redsoft:#FBE9E7;--pastel:#DCE9F7;--warnbg:#F4F3D9;--input:#FFFFFF;--sel:#E8EEF5;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:where(#ctRoot,.ctx){scroll-padding-top:env(safe-area-inset-top,0px)}
:where(#ctRoot,.ctx) *,:where(#ctRoot,.ctx) *::before,:where(#ctRoot,.ctx) *::after{box-sizing:inherit}
:where(#ctRoot,.ctx){margin:0;font-family:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}

:where(#ctRoot,.ctx) button,:where(#ctRoot,.ctx) input,:where(#ctRoot,.ctx) select{font:inherit;color:inherit}
:where(#ctRoot,.ctx) :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
:where(#ctRoot,.ctx) [hidden]{display:none!important}

:where(#ctRoot,.ctx) .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:22px;padding:0 20px;min-height:58px;flex-wrap:wrap}
:where(#ctRoot,.ctx) .brand{display:flex;flex-direction:column;line-height:1.05}
:where(#ctRoot,.ctx) .brand b{font-weight:800;font-size:17px;letter-spacing:.14em}
:where(#ctRoot,.ctx) .brand small{font-size:10.5px;color:#C9D4E3;letter-spacing:.04em}
:where(#ctRoot,.ctx) .tabs{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:10px;margin-left:auto;flex-wrap:wrap}
:where(#ctRoot,.ctx) .tabs button{background:none;border:0;color:#C9D4E3;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
:where(#ctRoot,.ctx) .tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:11px}
:where(#ctRoot,.ctx) .tabs button[aria-selected="true"]{background:#fff;color:var(--navy)}
:where(#ctRoot,.ctx) .tabs button[aria-selected="true"] .n{background:var(--gold);border-color:var(--gold);color:var(--navy)}
:where(#ctRoot,.ctx) .tabs .sep{width:1px;background:rgba(255,255,255,.2);margin:4px 2px}

:where(#ctRoot,.ctx) main{padding:18px 20px 40px;max-width:1520px;margin:0 auto}
:where(#ctRoot,.ctx) .note{font-size:12.5px;color:var(--muted);margin:0 0 12px}
:where(#ctRoot,.ctx) .wrap{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
:where(#ctRoot,.ctx) .wrap.full{grid-template-columns:1fr}
:where(#ctRoot,.ctx) .wrap.full>#side{display:none}
@media (max-width:960px){:where(#ctRoot,.ctx) .wrap{grid-template-columns:1fr}}
:where(#ctRoot,.ctx) .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
:where(#ctRoot,.ctx) .panel-h{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
:where(#ctRoot,.ctx) .panel-h h2{font-size:14px;margin:0;font-weight:700}
:where(#ctRoot,.ctx) .panel-b{padding:12px 14px}
:where(#ctRoot,.ctx) .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input)}

/* lista moldes */
:where(#ctRoot,.ctx) .mlist{list-style:none;margin:0;padding:6px;max-height:calc(100vh - 220px);overflow:auto}
:where(#ctRoot,.ctx) .mlist button{width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:0 10px;align-items:center}
:where(#ctRoot,.ctx) .mlist button:hover{background:var(--soft)}
:where(#ctRoot,.ctx) .mlist button[aria-current="true"]{background:var(--sel);box-shadow:inset 3px 0 0 var(--gold)}
:where(#ctRoot,.ctx) .mth{width:40px;height:40px;border-radius:6px;background:var(--soft);overflow:hidden;display:grid;place-items:center;grid-row:span 2}
:where(#ctRoot,.ctx) .mth img{width:100%;height:100%;object-fit:contain;background:#fff}
:where(#ctRoot,.ctx) .mth span{font-size:8px;color:var(--muted);text-align:center;line-height:1.1}
:where(#ctRoot,.ctx) .mcode{font-weight:700;font-size:13px}
:where(#ctRoot,.ctx) .msub{font-size:11px;color:var(--muted)}
:where(#ctRoot,.ctx) .mpct{grid-row:span 2;font-size:11.5px;font-weight:700;color:var(--muted)}
:where(#ctRoot,.ctx) .mpct.ok{color:var(--teal)}
:where(#ctRoot,.ctx) .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}

/* cabecera de vista */
:where(#ctRoot,.ctx) .vh{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}
:where(#ctRoot,.ctx) .vh h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
:where(#ctRoot,.ctx) .vh .meta{font-size:12.5px;color:var(--muted)}
:where(#ctRoot,.ctx) .vh .grow{flex:1;min-width:220px}
:where(#ctRoot,.ctx) .imgbox{width:150px;height:150px;border:1px dashed var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
:where(#ctRoot,.ctx) .imgbox img{width:100%;height:100%;object-fit:contain}
:where(#ctRoot,.ctx) .imgbox .ph{font-size:11px;color:#5A6B80;text-align:center;padding:8px}
:where(#ctRoot,.ctx) .imgbox.sm{width:72px;height:72px}
:where(#ctRoot,.ctx) .imgact{display:flex;gap:10px;align-items:center;margin-top:6px}
:where(#ctRoot,.ctx) .unit{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
:where(#ctRoot,.ctx) .unit select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--input)}
:where(#ctRoot,.ctx) .warns{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px}
:where(#ctRoot,.ctx) .warns b{display:block;margin-bottom:4px}
:where(#ctRoot,.ctx) .warns ul{margin:0;padding-left:18px}

/* tablas de edición */
:where(#ctRoot,.ctx) .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
:where(#ctRoot,.ctx) table.ed{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
:where(#ctRoot,.ctx) table.ed th,:where(#ctRoot,.ctx) table.ed td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
:where(#ctRoot,.ctx) table.ed thead th{background:var(--soft);font-size:12px;font-weight:700}
:where(#ctRoot,.ctx) table.ed thead th small{display:block;font-weight:500;color:var(--muted)}
:where(#ctRoot,.ctx) table.ed tbody tr:last-child td{border-bottom:0}
:where(#ctRoot,.ctx) .fi{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:12.5px}
:where(#ctRoot,.ctx) .fi.b{font-weight:700}
:where(#ctRoot,.ctx) .fi.num{width:90px;text-align:right;font-variant-numeric:tabular-nums}
:where(#ctRoot,.ctx) .fi.ok{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
:where(#ctRoot,.ctx) .btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px}
:where(#ctRoot,.ctx) .btn:hover{border-color:var(--navy)}
:where(#ctRoot,.ctx) .btn.sm{padding:4px 9px;font-size:11.5px}
:where(#ctRoot,.ctx) .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:where(#ctRoot,.ctx) .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
:where(#ctRoot,.ctx) .btn:disabled{opacity:.45;cursor:not-allowed}
:where(#ctRoot,.ctx) .link{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;font-size:12px;padding:0}
:where(#ctRoot,.ctx) .link.del{color:var(--muted)}
:where(#ctRoot,.ctx) .na{font-size:11.5px;color:var(--muted);font-style:italic}
:where(#ctRoot,.ctx) .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;flex-wrap:wrap}

/* despiece */
:where(#ctRoot,.ctx) .desp{display:flex;flex-direction:column;gap:3px}
:where(#ctRoot,.ctx) .dp{display:flex;align-items:center;gap:2px}
:where(#ctRoot,.ctx) .dp .br{font-weight:800;color:var(--muted)}
:where(#ctRoot,.ctx) .dq{width:38px;padding:3px 2px;border:1px solid var(--line);border-radius:5px;background:var(--input);text-align:center;font-weight:800}
:where(#ctRoot,.ctx) .dn{flex:1;min-width:130px;padding:3px 6px;border:1px solid transparent;border-radius:5px;background:transparent;font-weight:600;font-size:12.5px;margin-left:4px}
:where(#ctRoot,.ctx) .dn:hover,:where(#ctRoot,.ctx) .dn:focus{border-color:var(--line);background:var(--input)}
:where(#ctRoot,.ctx) .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
:where(#ctRoot,.ctx) .dfoot{display:flex;justify-content:space-between;align-items:center;margin-top:3px;gap:8px}
:where(#ctRoot,.ctx) .dtot{font-size:11px;color:var(--muted)}
:where(#ctRoot,.ctx) .addc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
:where(#ctRoot,.ctx) .addc b{font-size:13px;margin-right:4px}
:where(#ctRoot,.ctx) .addc .fi{width:auto}
:where(#ctRoot,.ctx) .psel2{padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--input);font-size:12px}

/* combos */
:where(#ctRoot,.ctx) .progbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:12px 14px;margin-bottom:14px}
:where(#ctRoot,.ctx) .progbar label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
:where(#ctRoot,.ctx) .progbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);font-weight:800;font-size:15px}
:where(#ctRoot,.ctx) .combos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
:where(#ctRoot,.ctx) .combo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:700;background:var(--soft)}
:where(#ctRoot,.ctx) .combo small{font-weight:500;color:var(--muted)}
:where(#ctRoot,.ctx) .cadd{display:flex;gap:6px;align-items:center}
:where(#ctRoot,.ctx) .cadd .fi{width:110px}
:where(#ctRoot,.ctx) .cadd .fi.w{width:160px}
:where(#ctRoot,.ctx) td.cc{min-width:190px}
:where(#ctRoot,.ctx) .row1,:where(#ctRoot,.ctx) .row2{display:flex;align-items:center;gap:6px}
:where(#ctRoot,.ctx) .row1{margin-bottom:6px}
:where(#ctRoot,.ctx) .row1 span,:where(#ctRoot,.ctx) .row2 span{font-size:10px;font-weight:800;color:var(--muted);width:34px;flex:none}
:where(#ctRoot,.ctx) .th{width:34px;height:34px;border-radius:5px;border:1px solid var(--line);background:#fff;flex:none;overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--muted)}
:where(#ctRoot,.ctx) .th img{width:100%;height:100%;object-fit:cover}
:where(#ctRoot,.ctx) td.off{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);color:var(--muted);font-size:11.5px;font-style:italic}
:where(#ctRoot,.ctx) .thc{display:flex;flex-direction:column;gap:4px}
:where(#ctRoot,.ctx) .thc label{font-size:11px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
:where(#ctRoot,.ctx) .compc b{display:block;font-size:13px}
:where(#ctRoot,.ctx) .compc span{display:block;font-size:11px;color:var(--muted)}

/* maestro prints */
:where(#ctRoot,.ctx) .prn{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media (max-width:960px){:where(#ctRoot,.ctx) .prn{grid-template-columns:1fr}}
:where(#ctRoot,.ctx) .field{margin-bottom:12px}
:where(#ctRoot,.ctx) .field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
:where(#ctRoot,.ctx) .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
:where(#ctRoot,.ctx) .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
:where(#ctRoot,.ctx) .pcard.ed{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
:where(#ctRoot,.ctx) .pcard .pi{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
:where(#ctRoot,.ctx) .pcard .pi img{width:100%;height:100%;object-fit:cover}
:where(#ctRoot,.ctx) .pcard .pb{padding:9px 11px;display:flex;flex-direction:column;gap:3px;font-size:12px;flex:1}
:where(#ctRoot,.ctx) .pcard .pl{font-weight:800;font-size:13px}
:where(#ctRoot,.ctx) .pcard .pt{color:var(--muted);font-size:11.5px}
:where(#ctRoot,.ctx) .pcard .pw{color:#8a8714;font-weight:700;font-size:11px}
:where(#ctRoot,.ctx) .pcard .pa{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:7px 11px}
:where(#ctRoot,.ctx) .prev-img{width:100%;aspect-ratio:1/1;border:1px dashed var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;margin-bottom:6px}
:where(#ctRoot,.ctx) .prev-img img{width:100%;height:100%;object-fit:cover}
:where(#ctRoot,.ctx) .msg{font-size:12px;margin-top:8px;font-weight:700}
:where(#ctRoot,.ctx) .msg.err{color:#B3261E}:where(#ctRoot,.ctx) .msg.ok{color:var(--teal)}

/* reporte */
:where(#ctRoot,.ctx) .rbar{display:grid;grid-template-columns:200px 1fr 280px;gap:18px;padding:14px 16px;margin-bottom:16px;align-items:start}
@media (max-width:960px){:where(#ctRoot,.ctx) .rbar{grid-template-columns:1fr}}
:where(#ctRoot,.ctx) .rbar .lbl{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
:where(#ctRoot,.ctx) .rbar select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);font-weight:800;font-size:15px}
:where(#ctRoot,.ctx) .gwrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
:where(#ctRoot,.ctx) .group{border:1px solid var(--line);border-radius:10px;padding:10px;flex:1 1 300px}
:where(#ctRoot,.ctx) .group-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
:where(#ctRoot,.ctx) .group-h b{font-size:13px}:where(#ctRoot,.ctx) .group-h b span{color:var(--muted);font-weight:500}
:where(#ctRoot,.ctx) .chips{display:flex;flex-wrap:wrap;gap:6px}
:where(#ctRoot,.ctx) .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-weight:600}
:where(#ctRoot,.ctx) .chip small{font-weight:500;color:var(--muted)}
:where(#ctRoot,.ctx) .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:where(#ctRoot,.ctx) .chip[aria-pressed="true"] small{color:#C9D4E3}
:where(#ctRoot,.ctx) .chip:disabled{opacity:.35;cursor:not-allowed}
:where(#ctRoot,.ctx) .procs{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-bottom:6px}
:where(#ctRoot,.ctx) .procs label{display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 0}
:where(#ctRoot,.ctx) .procs label.off{opacity:.4}
:where(#ctRoot,.ctx) .procs label small{margin-left:auto;color:var(--muted)}
:where(#ctRoot,.ctx) .pcode{display:inline-block;min-width:24px;text-align:center;font-weight:800;font-size:10.5px;border-radius:4px;padding:1px 4px;background:var(--soft);color:var(--ink)}
:where(#ctRoot,.ctx) .summary{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:8px 0}
:where(#ctRoot,.ctx) .summary strong{font-size:20px;display:block;line-height:1.1}
:where(#ctRoot,.ctx) .car-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
:where(#ctRoot,.ctx) .car-h h2{margin:0;font-size:16px;font-weight:800}
:where(#ctRoot,.ctx) .car-h h2 span{font-weight:500;color:var(--muted);font-size:13px}
:where(#ctRoot,.ctx) .car-nav{display:flex;gap:10px;align-items:center}
:where(#ctRoot,.ctx) .carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
:where(#ctRoot,.ctx) .card{flex:0 0 228px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
:where(#ctRoot,.ctx) .card.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
:where(#ctRoot,.ctx) .card.out{opacity:.55}
:where(#ctRoot,.ctx) .card-main{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
:where(#ctRoot,.ctx) .card-main:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
:where(#ctRoot,.ctx) .c-img{height:120px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
:where(#ctRoot,.ctx) .c-img img{width:100%;height:100%;object-fit:contain}
:where(#ctRoot,.ctx) .c-img .ph{font-size:11px;color:#5A6B80}
:where(#ctRoot,.ctx) .c-img .g{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:11px;border-radius:5px;padding:2px 7px}
:where(#ctRoot,.ctx) .c-top{background:var(--navy);color:#fff;padding:8px 12px;font-size:14.5px;font-weight:800}
:where(#ctRoot,.ctx) .c-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
:where(#ctRoot,.ctx) .c-peds{display:flex;flex-wrap:wrap;gap:4px}
:where(#ctRoot,.ctx) .c-peds i{font-style:normal;background:var(--soft);border-radius:5px;padding:2px 6px;font-size:10.5px;font-weight:600}
:where(#ctRoot,.ctx) .c-st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:11.5px;color:var(--muted)}
:where(#ctRoot,.ctx) .c-st b{color:var(--ink)}:where(#ctRoot,.ctx) .c-st b.ok{color:var(--teal)}
:where(#ctRoot,.ctx) .c-warn{font-size:11px;color:#8a8714;font-weight:700}
:where(#ctRoot,.ctx) .c-inc{border-top:1px solid var(--line);padding:8px 12px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer}
:where(#ctRoot,.ctx) .empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* hoja (papel) */
:where(#ctRoot,.ctx) .preview{display:flex;flex-direction:column;gap:18px}
:where(#ctRoot,.ctx) .sheet{background:#fff;color:#0B1F38;width:100%;max-width:1123px;min-height:calc(min(100%,1123px)*0.707);border-radius:4px;box-shadow:0 1px 2px rgba(8,45,88,.12),0 8px 24px rgba(8,45,88,.10);padding:0 24px 18px;display:flex;flex-direction:column}
:where(#ctRoot,.ctx) .sheet:not(.on){display:none}
:where(#ctRoot,.ctx) .sh-head{display:flex;align-items:center;gap:16px;background:#082D58;color:#fff;margin:0 -24px;padding:11px 24px}
:where(#ctRoot,.ctx) .sh-head .lg{font-weight:800;letter-spacing:.14em;font-size:14px}
:where(#ctRoot,.ctx) .sh-head .tt{font-weight:600;font-size:13px;color:#C9D4E3;border-left:1px solid rgba(255,255,255,.25);padding-left:16px}
:where(#ctRoot,.ctx) .sh-head .fn{margin-left:auto;font-weight:800;font-size:16px;color:#B2B021}
:where(#ctRoot,.ctx) .sh-top{display:flex;gap:18px;align-items:stretch;padding:10px 0;border-bottom:2px solid #B2B021;margin-bottom:8px}
:where(#ctRoot,.ctx) .sh-img{width:120px;height:96px;border:1px solid #CBD3DD;border-radius:4px;display:grid;place-items:center;overflow:hidden;flex:none}
:where(#ctRoot,.ctx) .sh-img img{width:100%;height:100%;object-fit:contain}
:where(#ctRoot,.ctx) .sh-img span{font-size:9px;color:#5A6B80;text-align:center;padding:4px}
:where(#ctRoot,.ctx) .sh-meta{display:flex;flex-wrap:wrap;gap:6px 24px;align-content:center}
:where(#ctRoot,.ctx) .sh-meta div{font-size:10px;color:#5A6B80}
:where(#ctRoot,.ctx) .sh-meta b{display:block;font-size:12px;color:#0B1F38}
:where(#ctRoot,.ctx) table.sh{border-collapse:collapse;width:100%;font-size:9.4px;table-layout:fixed}
:where(#ctRoot,.ctx) table.sh th,:where(#ctRoot,.ctx) table.sh td{border:1px solid #CBD3DD;padding:4px 5px;vertical-align:top;text-align:left;word-wrap:break-word}
:where(#ctRoot,.ctx) table.sh thead th{background:#082D58;color:#fff;font-weight:700}
